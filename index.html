<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои дела</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete" />
</head>

<body>
    <div class="main">
        <h1 class="header">My task list</h1>
        <div class="input-area">

            <input id="input-task" placeholder="smth new" />
            <button id="add-btn">Add new note</button>
        </div>
        <ul id='task-list' class="task-list">
            <li class="item low-priority" onclick="this.classList.toggle('completed')">
                <span class="task-content">Написать реферат</span>
                <div class="actions">
                    <button class="btn" onclick="this.parentNode.parentNode.remove()">
                        <span class="material-symbols-outlined">
                            delete
                        </span> </button>
                </div>
            </li>
            <li class="item high-priority" onclick="this.classList.toggle('completed')">
                <span class="task-content">Выступить на конференции</span>
                <div class="actions">
                    <button class="btn" onclick="this.parentNode.parentNode.remove()">
                        <span class="material-symbols-outlined">
                            delete
                        </span> </button>
                </div>
            </li>
            <li class="item high-priority" onclick="this.classList.toggle('completed')">
                <span class="task-content">Полететь в космос</span>
                <div class="actions">
                    <button class="btn" onclick="this.parentNode.parentNode.remove()">
                        <span class="material-symbols-outlined">
                            delete
                        </span> </button>
                </div>
            </li>
            <li class="item" onclick="this.classList.toggle('completed')">
                <span class="task-content">Спааааааать</span>
                <div class="actions">
                    <button class="btn" onclick="this.parentNode.parentNode.remove()">
                        <span class="material-symbols-outlined">
                            delete
                        </span> </button>
                </div>
            </li>
            <li class="item medium-priority completed" onclick="this.classList.toggle('completed')">
                <span class="task-content">Сварить пельмешки</span>
                <div class="actions">
                    <button class="btn" onclick="this.parentNode.parentNode.remove()">
                        <span class="material-symbols-outlined">
                            delete
                        </span> </button>
                </div>
            </li>



        </ul>
    </div>
</body>
<script src="index.js">
</script>

</html>
